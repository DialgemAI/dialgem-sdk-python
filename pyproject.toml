[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dialgem"
dynamic = ["version"]
description = "Official Python SDK for the Dialgem voice AI API: agents, calls, phone numbers and webhook verification from your backend."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Dialgem" }]
keywords = ["dialgem", "voice-ai", "voice-agent", "telephony", "sdk"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.6,<3",
  "typing_extensions>=4.7",
]

[project.urls]
Homepage = "https://github.com/DialgemAI/dialgem-sdk-python"
Issues = "https://github.com/DialgemAI/dialgem-sdk-python/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21", "mypy>=1.10", "ruff>=0.5", "build", "twine"]

[tool.hatch.version]
path = "src/dialgem/_version.py"
pattern = 'VERSION = "(?P<version>[^"]+)"'

[tool.hatch.build.targets.wheel]
packages = ["src/dialgem"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "LICENSE", "NOTICE", "CHANGELOG.md", "docs", "examples"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["src/dialgem/types/*.py", "src/dialgem/aresources", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008", "UP006", "UP007", "UP035", "UP045"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = false
plugins = ["pydantic.mypy"]
exclude = ["tests/"]
